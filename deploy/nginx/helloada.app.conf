# CrawlSEO at https://crawlseo.helloada.app/crawlseo/
#
# Before enabling HTTPS, provision the certificate with:
#   sudo certbot --nginx -d crawlseo.helloada.app
# Then change the HTTP server below to redirect to HTTPS and add the
# certificate-managed HTTPS server block.

server {
    listen 80;
    listen [::]:80;
    server_name crawlseo.helloada.app;

    # Auth.js uses the root callback URL when NEXTAUTH_URL has no path.
    location /api/auth/ {
        proxy_pass http://127.0.0.1:3001/crawlseo/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /crawlseo {
        return 301 /crawlseo/;
    }

    # Project-scoped Streamable HTTP MCP. The MCP process performs bearer
    # authentication; Nginx only forwards the header and preserves streaming.
    location /mcp {
        proxy_pass http://127.0.0.1:3006;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location /crawlseo/ {
        proxy_pass http://127.0.0.1:3001/crawlseo/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
        proxy_buffering off;
    }

    location / {
        return 404;
    }
}
